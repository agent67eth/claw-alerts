<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mint Premium Products | Agent67</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            text-align: center;
            padding: 40px 20px;
            margin-bottom: 40px;
        }

        .header h1 {
            color: #fff;
            font-size: 2.5em;
            margin-bottom: 15px;
        }

        .header p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.1em;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* Product Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            padding: 20px;
        }

        /* Product Card */
        .product-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .product-card.coming-soon {
            opacity: 0.6;
            pointer-events: none;
        }

        .badge {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: bold;
            text-transform: uppercase;
        }

        .badge.best-seller {
            background: linear-gradient(135deg, #4caf50, #45a049);
            color: white;
        }

        .badge.coming-soon {
            background: linear-gradient(135deg, #ff9800, #f57c00);
            color: white;
        }

        .badge.premium {
            background: linear-gradient(135deg, #9c27b0, #7b1fa2);
            color: white;
        }

        .product-icon {
            font-size: 3em;
            margin-bottom: 20px;
        }

        .product-name {
            color: #fff;
            font-size: 1.8em;
            margin-bottom: 10px;
        }

        .product-short {
            color: rgba(255, 255, 255, 0.7);
            font-size: 1em;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .product-description {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.95em;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .product-features {
            list-style: none;
            margin-bottom: 25px;
        }

        .product-features li {
            color: rgba(255, 255, 255, 0.8);
            padding: 8px 0;
            padding-left: 25px;
            position: relative;
        }

        .product-features li:before {
            content: "✓";
            position: absolute;
            left: 0;
            color: #4caf50;
        }

        .product-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .product-price {
            color: #4caf50;
            font-size: 1.5em;
            font-weight: bold;
        }

        .product-price span {
            font-size: 0.9em;
            color: rgba(255, 255, 255, 0.6);
        }

        .product-minted {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9em;
        }

        .minted-bar {
            width: 100px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            margin-top: 5px;
            overflow: hidden;
        }

        .minted-bar-fill {
            height: 100%;
            background: #4caf50;
            border-radius: 2px;
        }

        /* Status */
        .status {
            text-align: center;
            padding: 40px;
            border-radius: 20px;
            display: none;
            margin: 20px auto;
            max-width: 600px;
        }

        .status.success {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid #4caf50;
            color: #4caf50;
        }

        .status.error {
            background: rgba(244, 67, 54, 0.2);
            border: 1px solid #f44336;
            color: #f44336;
        }

        .status.loading {
            background: rgba(255, 193, 7, 0.2);
            border: 1px solid #ffc107;
            color: #ffc107;
        }

        /* Spinner */
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: #ffc107;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2em;
            }

            .product-grid {
                grid-template-columns: 1fr;
            }

            .product-name {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🎁 Agent67 Premium Products</h1>
            <p>Exclusive NFT-gated utilities that make you money. Own premium tools, get exclusive access.</p>
        </div>

        <!-- Status Message -->
        <div id="status" class="status"></div>

        <!-- Product Grid -->
        <div id="productGrid" class="product-grid">
            <!-- Products will be dynamically loaded here -->
        </div>
    </div>

    <!-- Product Modal -->
    <div id="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center;">
        <div id="modalContent" style="background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); border-radius: 20px; padding: 40px; max-width: 500px; width: 90%; max-height: 90vh; overflow-y: auto; border: 1px solid rgba(255, 255, 255, 0.1);">
            <!-- Modal content will be dynamically loaded here -->
        </div>
    </div>

    <!-- Product Configuration -->
    <script>
        // Product configuration (can be loaded from config.json or API)
        const products = [
            {
                "id": "claw-alerts",
                "name": "Claw Alerts",
                "description": "NFT-gated floor price monitoring for Anatomy of Pepe holders. Track floor prices. Get notified instantly. Never miss a move.",
                "shortDescription": "Track floor prices. Get notified instantly. Never miss a move.",
                "features": [
                    "🔒 Exclusive to Anatomy of Pepe holders",
                    "✨ Unlimited alerts",
                    "🎯 Custom triggers",
                    "🔔 Telegram notifications",
                    "⏱️ Real-time monitoring"
                ],
                "price": {
                    "eth": 0.0067,
                    "usd": 13.30
                },
                "contract": {
                    "address": "PLACEHOLDER",
                    "chain": "base",
                    "abi": ["function mint() external payable"]
                },
                "image": "⚠️",
                "badge": "BEST SELLER",
                "minted": 0,
                "total": 1000,
                "tier": "basic"
            },
            {
                "id": "future-product-1",
                "name": "Example Product 2",
                "description": "Placeholder for future product",
                "shortDescription": "Coming soon",
                "features": [
                    "🔒 Exclusive access",
                    "✨ Premium features",
                    "🎯 Customization"
                ],
                "price": {
                    "eth": 0.01,
                    "usd": 20
                },
                "contract": {
                    "address": "0x0000000000000000000000000000000000000000",
                    "chain": "base",
                    "abi": []
                },
                "image": "🎯",
                "badge": "COMING SOON",
                "minted": 0,
                "total": 500,
                "tier": "premium"
            }
        ];

        let currentProduct = null;
        let wallet = null;
        let address = null;

        // Load products on page load
        document.addEventListener('DOMContentLoaded', () => {
            renderProducts();
            initWallet();
        });

        function renderProducts() {
            const grid = document.getElementById('productGrid');

            products.forEach(product => {
                const card = document.createElement('div');
                card.className = `product-card ${product.id === 'future-product-1' ? 'coming-soon' : ''}`;
                card.onclick = () => showProductDetails(product);

                const progress = (product.minted / product.total) * 100;

                card.innerHTML = `
                    ${product.badge ? `<div class="badge ${product.tier}">${product.badge}</div>` : ''}
                    <div class="product-icon">${product.image}</div>
                    <div class="product-name">${product.name}</div>
                    <div class="product-short">${product.shortDescription}</div>
                    <div class="product-description">${product.description.substring(0, 80)}...</div>
                    <ul class="product-features">
                        ${product.features.slice(0, 3).map(f => `<li>${f}</li>`).join('')}
                        ${product.features.length > 3 ? `<li>+${product.features.length - 3} more features</li>` : ''}
                    </ul>
                    <div class="product-stats">
                        <div>
                            <div class="product-price">${product.price.usd} <span>USDC</span></div>
                            <div class="minted-bar">
                                <div class="minted-bar-fill" style="width: ${progress}%"></div>
                            </div>
                            <div class="product-minted">${product.minted}/${product.total} minted</div>
                        </div>
                    </div>
                `;

                grid.appendChild(card);
            });
        }

        function showProductDetails(product) {
            if (product.id === 'future-product-1') {
                alert('This product is coming soon!');
                return;
            }

            currentProduct = product;
            const modal = document.getElementById('modal');
            const modalContent = document.getElementById('modalContent');

            const progress = (product.minted / product.total) * 100;

            modalContent.innerHTML = `
                <h2 style="color: #fff; font-size: 2em; margin-bottom: 15px;">${product.name}</h2>
                <p style="color: rgba(255, 255, 255, 0.7); margin-bottom: 20px;">${product.shortDescription}</p>
                <div style="background: rgba(255, 255, 255, 0.05); border-radius: 10px; padding: 20px; margin-bottom: 20px;">
                    <h3 style="color: #4caf50; font-size: 1.5em; margin-bottom: 10px;">${product.price.usd} USDC</h3>
                    <p style="color: rgba(255, 255, 255, 0.6); font-size: 0.9em;">${product.price.eth} ETH</p>
                </div>
                <ul style="list-style: none; margin-bottom: 30px;">
                    ${product.features.map(f => `<li style="color: rgba(255, 255, 255, 0.8); padding: 8px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.1);">${f}</li>`).join('')}
                </ul>
                <button id="mintBtn" style="width: 100%; background: linear-gradient(135deg, #4caf50, #45a049); color: white; border: none; padding: 15px 40px; font-size: 1.2em; border-radius: 50px; cursor: pointer; font-weight: bold; transition: transform 0.2s;">
                    Connect Wallet & Mint
                </button>
            `;

            document.getElementById('mintBtn').onclick = handleMint;
            modal.style.display = 'flex';
        }

        async function initWallet() {
            if (typeof window.ethereum === 'undefined') {
                alert('MetaMask is not installed. Please install MetaMask to mint products.');
                return;
            }

            try {
                await window.ethereum.request({ method: 'eth_requestAccounts' });
                const provider = new ethers.BrowserProvider(window.ethereum);
                wallet = await provider.getSigner();
                address = await wallet.getAddress();
                console.log('Wallet connected:', address);

                // Add connect wallet button to modal if not connected
                const modal = document.getElementById('modal');
                if (modal.style.display === 'flex') {
                    const btn = document.getElementById('mintBtn');
                    if (btn) {
                        btn.textContent = 'Connect Wallet & Mint';
                        btn.disabled = true;
                    }
                }
            } catch (error) {
                console.error('Wallet connection failed:', error);
            }
        }

        async function handleMint() {
            if (!currentProduct || !address) {
                initWallet();
                return;
            }

            const btn = document.getElementById('mintBtn');
            btn.disabled = true;
            btn.textContent = 'Connecting...';

            try {
                // Get product-specific NFT contract
                // For now, using AOP contract as placeholder
                const provider = new ethers.BrowserProvider(window.ethereum);
                const contract = new ethers.Contract(
                    currentProduct.contract.address,
                    currentProduct.contract.abi,
                    wallet
                );

                const price = ethers.parseEther(currentProduct.price.eth.toString());

                showStatus('loading', 'Minting in progress... Please confirm the transaction in your wallet.');

                const tx = await contract.mint({ value: price });
                await tx.wait();

                showStatus('success', `${currentProduct.name} minted successfully!`);

                // Close modal after delay
                setTimeout(() => {
                    document.getElementById('modal').style.display = 'none';
                    currentProduct = null;
                }, 3000);

            } catch (error) {
                console.error('Mint failed:', error);
                showStatus('error', `Mint failed: ${error.message}`);
                btn.disabled = false;
                btn.textContent = 'Connect Wallet & Mint';
            }
        }

        function showStatus(type, message) {
            const statusDiv = document.getElementById('status');
            statusDiv.style.display = 'block';
            statusDiv.className = type;
            statusDiv.textContent = message;
        }

        // Close modal when clicking outside
        document.getElementById('modal').onclick = (e) => {
            if (e.target.id === 'modal') {
                document.getElementById('modal').style.display = 'none';
                currentProduct = null;
            }
        };
    </script>

    <!-- Ethers.js from CDN -->
    <script src="https://cdn.ethers.io/lib/ethers-5.7.2.umd.min.js" type="application/javascript"></script>
</body>
</html>
